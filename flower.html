  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d24">
  <meta name="description" content="Một bó hoa rực rỡ dành tặng bạn.">
  <link rel="stylesheet" href="css/main.css">

  <style>
    :root {
      --dark-color: #100d24;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(81, 42, 106, 0.55), transparent 56%),
        #100d24;
    }

    .night {
      background-image:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.9) 0 1px, transparent 1.8px),
        radial-gradient(circle at 80% 22%, rgba(255, 222, 247, 0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 67% 9%, rgba(255, 255, 255, 0.75) 0 1px, transparent 1.8px),
        radial-gradient(circle at 25% 43%, rgba(255, 222, 247, 0.7) 0 1px, transparent 2px),
        radial-gradient(ellipse at 50% 0%, rgba(97, 61, 139, 0.52), transparent 62%),
        linear-gradient(180deg, #100d24 0%, #211637 58%, #30203f 100%);
      background-size: 190px 180px, 230px 210px, 170px 200px, 250px 220px, auto, auto;
    }

    .flower-message {
      position: fixed;
      z-index: 30;
      top: clamp(2.25rem, 8vh, 5rem);
      left: 1rem;
      width: calc(100% - 2rem);
      padding: 0 0.75rem;
      color: #fff4fb;
      text-align: center;
      pointer-events: none;
      animation: message-appear 1.4s 0.5s both;
    }

    .flower-message__eyebrow {
      margin-bottom: 0.55rem;
      color: #f6afd1;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .flower-message h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 5.8vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.025em;
      text-shadow: 0 0 24px rgba(248, 159, 207, 0.45);
    }

    .flower-message__note {
      margin-top: 0.75rem;
      color: #e4d7ed;
      font-size: clamp(0.82rem, 2.4vw, 1rem);
      letter-spacing: 0.04em;
    }

    @keyframes message-appear {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .flower-message {
        top: 5vh;
      }

      .flower-message__eyebrow {
        font-size: 0.62rem;
      }

      .flower-message__note {
        margin-top: 0.55rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flower-message {
        animation: none;
      }
    }
  </style>
</head>
